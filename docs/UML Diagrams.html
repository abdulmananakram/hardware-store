<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UML Diagrams</title>
<style>
:root{--fg:#1a1a1a;--bg:#f7f7f5;--card:#fff;--border:#ddd;--accent:#c0143c;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#eee;--bg:#111;--card:#1b1b1b;--border:#333;}}
:root[data-theme="dark"]{--fg:#eee;--bg:#111;--card:#1b1b1b;--border:#333;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
h1{font-size:18px;text-align:center;padding:16px;margin:0;}
figure{max-width:900px;margin:0 auto 28px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
svg{width:100%;height:auto;color:var(--fg);}
figcaption{font-size:12.5px;color:var(--fg);opacity:.7;text-align:center;margin-top:8px;}
text{fill:currentColor;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
.accent{color:var(--accent);}
</style>
</head>
<body>
<h1>Hardware Shop App — UML Diagrams (Draft)</h1>

<figure>
<svg viewBox="0 0 700 460" role="img" aria-label="Use case diagram: Owner actor performs Manage Inventory, Create Sale Bill, Record Payment, Process Return, Record Purchase and View Notifications inside the Hardware Shop App system boundary; AI Import Stock extends Manage Inventory; Sync Offline Data is included by Create Sale Bill and Record Purchase.">
<defs>
<marker id="uc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<polygon points="0,0 10,5 0,10" fill="currentColor"/>
</marker>
</defs>
<!-- system boundary -->
<rect x="170" y="20" width="510" height="420" fill="none" stroke="currentColor" stroke-width="1.5" rx="6"/>
<text x="425" y="42" font-size="13" font-weight="600" text-anchor="middle">Hardware Shop App</text>

<!-- actor -->
<g transform="translate(60,220)">
<circle cx="0" cy="-40" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="0" y1="-28" x2="0" y2="20" stroke="currentColor" stroke-width="1.5"/>
<line x1="-20" y1="-10" x2="20" y2="-10" stroke="currentColor" stroke-width="1.5"/>
<line x1="0" y1="20" x2="-18" y2="55" stroke="currentColor" stroke-width="1.5"/>
<line x1="0" y1="20" x2="18" y2="55" stroke="currentColor" stroke-width="1.5"/>
<text x="0" y="75" font-size="12" text-anchor="middle">Shop Owner</text>
</g>

<!-- use case ellipses -->
<g font-size="11.5" text-anchor="middle">
<ellipse cx="320" cy="75" rx="90" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="320" y="79">Manage Inventory</text>

<ellipse cx="560" cy="75" rx="95" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="560" y="79">AI Import Stock</text>

<ellipse cx="320" cy="150" rx="90" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="320" y="154">Create Sale Bill</text>

<ellipse cx="320" cy="225" rx="90" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="320" y="221">Record Payment</text>
<text x="320" y="233">(Khata)</text>

<ellipse cx="320" cy="300" rx="90" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="320" y="304">Process Return</text>

<ellipse cx="320" cy="375" rx="90" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="320" y="379">Record Purchase</text>

<ellipse cx="560" cy="300" rx="95" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="560" y="296">Manage Supplier</text>
<text x="560" y="308">Khata</text>

<ellipse cx="560" cy="375" rx="95" ry="28" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="560" y="371">Sync Offline</text>
<text x="560" y="383">Data</text>

<ellipse cx="320" cy="415" rx="0" ry="0" fill="none"/>
</g>

<!-- actor to use cases -->
<g stroke="currentColor" stroke-width="1.2">
<line x1="78" y1="210" x2="230" y2="80"/>
<line x1="78" y1="215" x2="230" y2="150"/>
<line x1="78" y1="222" x2="230" y2="225"/>
<line x1="78" y1="228" x2="230" y2="300"/>
<line x1="78" y1="235" x2="230" y2="375"/>
</g>

<!-- extend -->
<line x1="465" y1="75" x2="415" y2="75" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#uc-arrow)"/>
<text x="440" y="66" font-size="10" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

<!-- include -->
<line x1="410" y1="160" x2="475" y2="330" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#uc-arrow)"/>
<line x1="410" y1="390" x2="475" y2="378" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#uc-arrow)"/>
<text x="435" y="245" font-size="10" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
</svg>
<figcaption>Use case diagram — Owner's direct interactions with the app, with AI Import extending Inventory and Sync Offline Data included by the two billing use cases.</figcaption>
</figure>

<figure>
<svg viewBox="0 0 780 560" role="img" aria-label="Data model diagram showing Category, Item, Customer, SaleBill, Return, Supplier, PurchaseBill and KhataTransaction entities with their key fields and relationships.">
<defs>
<marker id="er-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<polygon points="0,0 10,5 0,10" fill="currentColor"/>
</marker>
</defs>
<!-- helper boxes drawn manually -->
<!-- Category -->
<g transform="translate(40,30)">
<rect width="190" height="80" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="190" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="95" y="15" font-size="12" font-weight="700" text-anchor="middle">Category</text>
<text x="10" y="38" font-size="10.5">id, name</text>
<text x="10" y="54" font-size="10.5">parentCategoryId</text>
</g>

<!-- Item -->
<g transform="translate(310,30)">
<rect width="210" height="110" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="210" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="105" y="15" font-size="12" font-weight="700" text-anchor="middle">Item</text>
<text x="10" y="38" font-size="10.5">id, name, categoryId</text>
<text x="10" y="54" font-size="10.5">unit, baseQtyInStock</text>
<text x="10" y="70" font-size="10.5">price, lowStockThreshold</text>
<text x="10" y="86" font-size="10.5">photoUrl</text>
</g>

<!-- Customer -->
<g transform="translate(40,180)">
<rect width="190" height="80" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="190" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="95" y="15" font-size="12" font-weight="700" text-anchor="middle">Customer</text>
<text x="10" y="38" font-size="10.5">id, name, phone</text>
<text x="10" y="54" font-size="10.5">khataBalance</text>
</g>

<!-- SaleBill -->
<g transform="translate(310,180)">
<rect width="210" height="110" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="210" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="105" y="15" font-size="12" font-weight="700" text-anchor="middle">SaleBill</text>
<text x="10" y="38" font-size="10.5">id, date, customerId</text>
<text x="10" y="54" font-size="10.5">lines[itemId,qty,unit,price]</text>
<text x="10" y="70" font-size="10.5">paymentType, total</text>
<text x="10" y="86" font-size="10.5">syncStatus</text>
</g>

<!-- Return -->
<g transform="translate(580,180)">
<rect width="170" height="95" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="170" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="85" y="15" font-size="12" font-weight="700" text-anchor="middle">Return</text>
<text x="10" y="38" font-size="10.5">id, saleBillId, itemId</text>
<text x="10" y="54" font-size="10.5">qty, reason</text>
<text x="10" y="70" font-size="10.5">disposition</text>
</g>

<!-- Supplier -->
<g transform="translate(40,330)">
<rect width="190" height="80" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="190" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="95" y="15" font-size="12" font-weight="700" text-anchor="middle">Supplier</text>
<text x="10" y="38" font-size="10.5">id, name, phone</text>
<text x="10" y="54" font-size="10.5">payableBalance</text>
</g>

<!-- PurchaseBill -->
<g transform="translate(310,330)">
<rect width="210" height="110" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="210" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="105" y="15" font-size="12" font-weight="700" text-anchor="middle">PurchaseBill</text>
<text x="10" y="38" font-size="10.5">id, date, supplierId</text>
<text x="10" y="54" font-size="10.5">lines[itemId,qty,unit,cost]</text>
<text x="10" y="70" font-size="10.5">paymentType, total</text>
<text x="10" y="86" font-size="10.5">syncStatus</text>
</g>

<!-- KhataTransaction -->
<g transform="translate(200,480)">
<rect width="260" height="60" fill="none" stroke="currentColor" stroke-width="1.3" rx="4"/>
<rect width="260" height="22" fill="currentColor" opacity="0.12" rx="4"/>
<text x="130" y="15" font-size="12" font-weight="700" text-anchor="middle">KhataTransaction</text>
<text x="10" y="38" font-size="10.5">id, partyType, partyId, type, amount, date</text>
</g>

<!-- relationships -->
<g stroke="currentColor" stroke-width="1.2" fill="none">
<line x1="230" y1="65" x2="310" y2="65" marker-end="url(#er-arrow)"/>
<line x1="415" y1="140" x2="415" y2="180" marker-end="url(#er-arrow)"/>
<line x1="230" y1="220" x2="310" y2="220" marker-end="url(#er-arrow)"/>
<line x1="520" y1="225" x2="580" y2="225" marker-end="url(#er-arrow)"/>
<line x1="230" y1="370" x2="310" y2="370" marker-end="url(#er-arrow)"/>
<line x1="415" y1="290" x2="415" y2="330" marker-end="url(#er-arrow)" stroke-dasharray="3,3"/>
<line x1="135" y1="260" x2="280" y2="480" marker-end="url(#er-arrow)"/>
<line x1="135" y1="410" x2="300" y2="500" marker-end="url(#er-arrow)"/>
</g>
<text x="265" y="60" font-size="9.5">has</text>
<text x="420" y="165" font-size="9.5">sold via</text>
<text x="265" y="213" font-size="9.5">places</text>
<text x="545" y="218" font-size="9.5">yields</text>
<text x="265" y="363" font-size="9.5">supplies</text>
<text x="420" y="315" font-size="9.5">purchased via</text>
<text x="190" y="370" font-size="9.5">records</text>
<text x="190" y="455" font-size="9.5">records</text>
</svg>
<figcaption>Data model (class/ER) — core entities. Each SaleBill/PurchaseBill holds its line items inline; Returns reference the original SaleBill; both Customer and Supplier roll up into KhataTransaction (receivable vs payable).</figcaption>
</figure>

<figure>
<svg viewBox="0 0 680 420" role="img" aria-label="Sequence diagram: Owner creates a sale bill, the app saves it locally and deducts stock immediately, marks it pending sync, then syncs to the cloud server once internet is available.">
<defs>
<marker id="sq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<polygon points="0,0 10,5 0,10" fill="currentColor"/>
</marker>
</defs>
<!-- lifelines -->
<g font-size="12" text-anchor="middle">
<text x="80" y="24">Owner</text>
<text x="330" y="24">App (device)</text>
<text x="590" y="24">Cloud Server</text>
</g>
<line x1="80" y1="34" x2="80" y2="400" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="330" y1="34" x2="330" y2="400" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="590" y1="34" x2="590" y2="400" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>

<g font-size="10.5">
<line x1="80" y1="60" x2="326" y2="60" stroke="currentColor" stroke-width="1.2" marker-end="url(#sq-arrow)"/>
<text x="200" y="54" text-anchor="middle">select items + qty, confirm bill</text>

<rect x="310" y="72" width="40" height="46" fill="currentColor" opacity="0.1"/>
<text x="360" y="85" text-anchor="start">save bill to local DB</text>
<text x="360" y="99" text-anchor="start">deduct stock locally</text>
<text x="360" y="113" text-anchor="start">mark syncStatus = pending</text>

<line x1="330" y1="130" x2="84" y2="130" stroke="currentColor" stroke-width="1.2" marker-end="url(#sq-arrow)"/>
<text x="200" y="124" text-anchor="middle">bill saved — "Pending Sync" badge shown</text>

<line x1="150" y1="160" x2="560" y2="160" stroke="currentColor" stroke-width="1" stroke-dasharray="2,4"/>
<text x="355" y="153" text-anchor="middle" font-style="italic">[if internet available]</text>

<line x1="330" y1="190" x2="586" y2="190" stroke="currentColor" stroke-width="1.2" marker-end="url(#sq-arrow)"/>
<text x="460" y="184" text-anchor="middle">upload pending bill (POST /api/v1/sales)</text>

<rect x="570" y="202" width="40" height="30" fill="currentColor" opacity="0.1"/>
<text x="460" y="220" text-anchor="middle">validate, store, update server stock</text>

<line x1="590" y1="246" x2="334" y2="246" stroke="currentColor" stroke-width="1.2" marker-end="url(#sq-arrow)"/>
<text x="460" y="240" text-anchor="middle">sync acknowledged</text>

<rect x="310" y="258" width="40" height="30" fill="currentColor" opacity="0.1"/>
<text x="360" y="272" text-anchor="start">mark syncStatus = synced</text>

<line x1="330" y1="300" x2="84" y2="300" stroke="currentColor" stroke-width="1.2" marker-end="url(#sq-arrow)"/>
<text x="200" y="294" text-anchor="middle">badge updates to "Synced"</text>
</g>
</svg>
<figcaption>Sequence diagram — creating a sale bill works fully offline first (local save + stock deduction), then syncs to the cloud whenever internet becomes available.</figcaption>
</figure>

</body>
