<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_nut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="nut_metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="inner_thread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow_nut" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg_nut)"/>
  <circle cx="128" cy="128" r="90" fill="#ffffff" opacity="0.6"/>
  <g filter="url(#shadow_nut)">
    <!-- Hexagonal Nut Exterior -->
    <polygon points="128,40 204,84 204,172 128,216 52,172 52,84" fill="url(#nut_metal)"/>
    <!-- Hex Bevel Facets -->
    <polygon points="128,52 192,88 192,168 128,204 64,168 64,88" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.7"/>
    <!-- Thread Hole -->
    <circle cx="128" cy="128" r="44" fill="url(#inner_thread)"/>
    <!-- Internal Thread Ridges -->
    <circle cx="128" cy="128" r="44" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="16 8"/>
    <circle cx="128" cy="128" r="38" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="14 7"/>
    <circle cx="128" cy="128" r="32" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="12 6"/>
  </g>
</svg>
