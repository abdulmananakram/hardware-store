<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steel1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="90" fill="#ffffff" opacity="0.6"/>
  <!-- Group of Nails -->
  <g filter="url(#shadow)" transform="rotate(-30 128 128)">
    <!-- Nail 2 (background) -->
    <g transform="translate(-25, 10)">
      <rect x="120" y="55" width="16" height="130" rx="3" fill="url(#steel1)"/>
      <polygon points="120,185 136,185 128,215" fill="url(#steel2)"/>
      <ellipse cx="128" cy="55" rx="20" ry="7" fill="url(#steel1)"/>
      <ellipse cx="128" cy="53" rx="16" ry="5" fill="#f8fafc"/>
    </g>
    <!-- Nail 1 (main foreground) -->
    <g transform="translate(10, -10)">
      <rect x="120" y="45" width="18" height="145" rx="3" fill="url(#steel1)"/>
      <polygon points="120,190 138,190 129,225" fill="url(#steel2)"/>
      <ellipse cx="129" cy="45" rx="24" ry="8" fill="url(#steel1)"/>
      <ellipse cx="129" cy="42" rx="20" ry="6" fill="#f1f5f9"/>
      <!-- Head grip ribs -->
      <line x1="120" y1="65" x2="138" y2="65" stroke="#64748b" stroke-width="2"/>
      <line x1="120" y1="72" x2="138" y2="72" stroke="#64748b" stroke-width="2"/>
      <line x1="120" y1="79" x2="138" y2="79" stroke="#64748b" stroke-width="2"/>
    </g>
  </g>
</svg>
