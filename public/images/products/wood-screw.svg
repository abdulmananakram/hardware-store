<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_screw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow_screw" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg_screw)"/>
  <circle cx="128" cy="128" r="90" fill="#ffffff" opacity="0.6"/>
  <g filter="url(#shadow_screw)" transform="rotate(-35 128 128)">
    <!-- Screw Head (countersunk) -->
    <path d="M102,48 L154,48 L138,78 L118,78 Z" fill="url(#brass)"/>
    <ellipse cx="128" cy="48" rx="26" ry="8" fill="#fde047"/>
    <!-- Phillips cross on head -->
    <path d="M125,43 L131,43 L131,53 L125,53 Z" fill="#78350f"/>
    <path d="M120,46 L136,46 L136,50 L120,50 Z" fill="#78350f"/>
    <!-- Screw Shaft -->
    <rect x="120" y="78" width="16" height="110" fill="url(#brass)"/>
    <!-- Screw Tip -->
    <polygon points="120,188 136,188 128,222" fill="#d97706"/>
    <!-- Spiral Threads -->
    <g fill="#b45309">
      <polygon points="115,92 141,88 136,96 117,100"/>
      <polygon points="115,108 141,104 136,112 117,116"/>
      <polygon points="115,124 141,120 136,128 117,132"/>
      <polygon points="115,140 141,136 136,144 117,148"/>
      <polygon points="115,156 141,152 136,160 117,164"/>
      <polygon points="116,172 140,168 135,176 118,180"/>
      <polygon points="118,188 138,184 134,192 120,196"/>
    </g>
  </g>
</svg>
