<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="hammer_steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="handle_grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="35%" stop-color="#14b8a6"/>
      <stop offset="70%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="shadow_hammer" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg_tool)"/>
  <circle cx="128" cy="128" r="90" fill="#ffffff" opacity="0.6"/>
  <g filter="url(#shadow_hammer)" transform="rotate(-40 128 128)">
    <!-- Handle -->
    <rect x="120" y="80" width="16" height="150" rx="6" fill="#334155"/>
    <!-- Ergonomic Rubber Grip -->
    <rect x="116" y="140" width="24" height="85" rx="8" fill="url(#handle_grip)"/>
    <!-- Anti-slip ribs -->
    <line x1="116" y1="155" x2="140" y2="155" stroke="#042f2e" stroke-width="2.5"/>
    <line x1="116" y1="170" x2="140" y2="170" stroke="#042f2e" stroke-width="2.5"/>
    <line x1="116" y1="185" x2="140" y2="185" stroke="#042f2e" stroke-width="2.5"/>
    <line x1="116" y1="200" x2="140" y2="200" stroke="#042f2e" stroke-width="2.5"/>
    <!-- Hammer Forged Head -->
    <!-- Center block -->
    <rect x="106" y="55" width="44" height="34" rx="4" fill="url(#hammer_steel)"/>
    <!-- Striking face -->
    <path d="M150,55 L182,58 C185,58 188,62 188,67 L188,77 C188,82 185,86 182,86 L150,89 Z" fill="url(#hammer_steel)"/>
    <ellipse cx="188" cy="72" rx="4" ry="12" fill="#f8fafc"/>
    <!-- Curved Claw -->
    <path d="M106,55 C70,55 52,78 44,104 C54,92 78,84 106,89 Z" fill="url(#hammer_steel)"/>
  </g>
</svg>
