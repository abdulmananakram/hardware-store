<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="hex_steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="thread_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow_bolt" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg_bolt)"/>
  <circle cx="128" cy="128" r="90" fill="#ffffff" opacity="0.6"/>
  <g filter="url(#shadow_bolt)" transform="rotate(-30 128 128)">
    <!-- Hexagonal Head -->
    <polygon points="128,32 168,52 168,82 128,102 88,82 88,52" fill="url(#hex_steel)"/>
    <ellipse cx="128" cy="62" rx="36" ry="16" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
    <!-- Unthreaded shank -->
    <rect x="114" y="90" width="28" height="30" fill="url(#thread_grad)"/>
    <!-- Threaded Shaft -->
    <rect x="114" y="120" width="28" height="96" fill="url(#thread_grad)"/>
    <!-- Thread ridges -->
    <g stroke="#334155" stroke-width="2.5" fill="none">
      <line x1="110" y1="126" x2="146" y2="122"/>
      <line x1="110" y1="136" x2="146" y2="132"/>
      <line x1="110" y1="146" x2="146" y2="142"/>
      <line x1="110" y1="156" x2="146" y2="152"/>
      <line x1="110" y1="166" x2="146" y2="162"/>
      <line x1="110" y1="176" x2="146" y2="172"/>
      <line x1="110" y1="186" x2="146" y2="182"/>
      <line x1="110" y1="196" x2="146" y2="192"/>
      <line x1="110" y1="206" x2="146" y2="202"/>
    </g>
    <!-- Chamfered tip -->
    <polygon points="114,216 142,216 136,224 120,224" fill="#475569"/>
  </g>
</svg>
